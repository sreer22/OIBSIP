    <text x="76" y="275" text-anchor="middle" fill="#C8E86B" font-size="12" font-weight="700">P</text>
    <text x="110" y="276" fill="#183F35" font-size="18" font-weight="600">+1 (555) 014-2026</text>

    <circle cx="76" cy="320" r="14" fill="#153B35"/>
    <text x="76" y="325" text-anchor="middle" fill="#C8E86B" font-size="12" font-weight="700">E</text>
    <text x="110" y="326" fill="#183F35" font-size="18" font-weight="600">maya@morrow.earth</text>

    <circle cx="76" cy="370" r="14" fill="#153B35"/>
    <text x="76" y="375" text-anchor="middle" fill="#C8E86B" font-size="12" font-weight="700">W</text>
    <text x="110" y="376" fill="#183F35" font-size="18" font-weight="600">morrow.earth</text>

    <circle cx="76" cy="420" r="14" fill="#153B35"/>
