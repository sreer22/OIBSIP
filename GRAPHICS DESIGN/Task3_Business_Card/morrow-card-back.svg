  <text x="166" y="154" fill="#153B35" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700" letter-spacing="6">LET'S CONNECT</text>
  <text x="168" y="181" fill="#526B63" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" letter-spacing="2.2">SMALL STEPS. BETTER TOMORROWS.</text>

  <path d="M58 224H852" stroke="#CDD7C6" stroke-width="1"/>

