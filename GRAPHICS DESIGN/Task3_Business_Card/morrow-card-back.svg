  <text x="58" y="550" fill="#526B63" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" letter-spacing="1.3">MORROW  ·  CLIMATE INTELLIGENCE  ·  GOOD FOR WHAT'S NEXT</text>

