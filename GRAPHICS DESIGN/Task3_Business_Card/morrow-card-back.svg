<svg xmlns="http://www.w3.org/2000/svg" width="91mm" height="61mm" viewBox="0 0 910 610" role="img" aria-labelledby="title description">
  <title id="title">Morrow business card — back</title>
  <desc id="description">Bleed-size contact-information back of a Morrow climate intelligence business card. Trim size 85 by 55 millimetres, with 3 millimetres bleed.</desc>
  <rect width="910" height="610" fill="#F7F4E9"/>
