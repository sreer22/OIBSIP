<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title description">
  <title id="title">Nightwave music festival</title>
  <desc id="description">A summer festival poster in midnight blue, coral, mint, and cream with a custom illustrated vinyl record.</desc>
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF755F"/>
      <stop offset="1" stop-color="#FFB25C"/>
    </linearGradient>
    <linearGradient id="record" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36334F"/>
      <stop offset="1" stop-color="#171629"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="#151426"/>
  <circle cx="829" cy="508" r="314" fill="#211F39"/>
  <text x="72" y="78" fill="#75E3C2" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" letter-spacing="5">CITY NIGHTS · OPEN-AIR SESSIONS</text>
  <path d="M72 101H1008" stroke="#383550" stroke-width="2"/>
  <text x="64" y="237" fill="#FFF3E2" font-family="Arial Black,Arial,sans-serif" font-size="128" font-weight="900" letter-spacing="-7">NIGHT</text>
  <text x="64" y="364" fill="#FF755F" font-family="Arial Black,Arial,sans-serif" font-size="128" font-weight="900" letter-spacing="-7">WAVE</text>
  <text x="73" y="409" fill="#FFF3E2" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="2">LIVE MUSIC. LATE LIGHTS. ONE BIG NIGHT.</text>
  <g aria-label="Illustrated vinyl record">
    <circle cx="829" cy="630" r="217" fill="url(#record)" stroke="#75E3C2" stroke-width="3"/>
    <circle cx="829" cy="630" r="188" fill="none" stroke="#49435F" stroke-width="3"/>
    <circle cx="829" cy="630" r="164" fill="none" stroke="#38344E" stroke-width="3"/>
    <circle cx="829" cy="630" r="137" fill="none" stroke="#49435F" stroke-width="3"/>
    <circle cx="829" cy="630" r="91" fill="url(#sunset)"/>
    <circle cx="829" cy="630" r="44" fill="#151426"/>
    <circle cx="829" cy="630" r="8" fill="#FFF3E2"/>
    <path d="M831 412L908 309L964 331L941 349L916 339L852 431" fill="none" stroke="#FFF3E2" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="965" cy="331" r="17" fill="#75E3C2"/>
    <path d="M794 625Q829 590 864 625M794 638Q829 673 864 638" fill="none" stroke="#151426" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g fill="none" stroke="#75E3C2" stroke-width="3">
    <path d="M74 491q17-20 34 0t34 0 34 0 34 0 34 0"/>
    <path d="M74 513q17-20 34 0t34 0 34 0 34 0 34 0"/>
    <path d="M74 535q17-20 34 0t34 0 34 0 34 0 34 0"/>
  </g>
  <text x="74" y="680" fill="#FFF3E2" font-family="Arial Black,Arial,sans-serif" font-size="29" font-weight="900" letter-spacing="2">FRIDAY, AUG 21</text>
  <text x="74" y="721" fill="#FFF3E2" font-family="Arial,Helvetica,sans-serif" font-size="21">4 PM — LATE  ·  RIVERSIDE PARK</text>
  <text x="74" y="765" fill="#D4D0DF" font-family="Arial,Helvetica,sans-serif" font-size="18">Three stages. Local legends. Headline acts.</text>
  <text x="74" y="794" fill="#D4D0DF" font-family="Arial,Helvetica,sans-serif" font-size="18">Food trucks, friends &amp; a sky full of sound.</text>
  <rect x="72" y="855" width="936" height="137" rx="20" fill="#75E3C2"/>
  <text x="105" y="910" fill="#151426" font-family="Arial Black,Arial,sans-serif" font-size="27" font-weight="900" letter-spacing="1">YOUR SUMMER HAS A SOUNDTRACK.</text>
  <text x="105" y="954" fill="#151426" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">BOOK YOUR TICKET  →  NIGHTWAVE.FEST</text>
  <text x="1007" y="1030" fill="#C4BED3" font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="end" letter-spacing="2">NIGHTWAVE · MUSIC FOR THE MOMENT</text>
</svg>
