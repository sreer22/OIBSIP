<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title description">
  <title id="title">One Small Thing Earth Day campaign</title>
  <desc id="description">A community sustainability poster with an illustrated earth and sprouting leaves and three ways to help.</desc>
  <defs>
    <clipPath id="earthClip"><circle cx="769" cy="436" r="203"/></clipPath>
