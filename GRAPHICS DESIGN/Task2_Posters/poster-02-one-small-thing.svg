      <stop offset="0" stop-color="#72CEB2"/>
      <stop offset="1" stop-color="#42A48D"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="#F7F4E9"/>
  <rect width="1080" height="19" fill="#C8E86B"/>
  <text x="72" y="91" fill="#225347" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="4">A COMMUNITY EARTH DAY INVITATION</text>
  <text x="1008" y="91" fill="#225347" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="end">APRIL 22 · 2026</text>
