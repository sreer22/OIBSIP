<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f5">
  <title>Stopwatch</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #222;
      background: #f5f5f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 480px);
      padding: 36px 28px;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 18px 50px rgb(15 23 42 / 8%);
    }

    h1 {
      margin: 0 0 36px;
      text-align: center;
      font-size: 1.25rem;
      letter-spacing: 0.14em;
    }

    #timer {
      margin: 0 0 36px;
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(2.6rem, 12vw, 3.5rem);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    button {
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: #e9edf3;
      color: #172033;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: filter 120ms ease, transform 120ms ease;
    }

    button:hover:not(:disabled) {
      filter: brightness(0.96);
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 3px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    #start {
      background: #2563eb;
      color: #fff;
    }

    #reset {
      background: #fee2e2;
      color: #991b1b;
    }

    h2 {
      margin: 32px 0 10px;
      font-size: 1.1rem;
    }

    #laps {
      max-height: 220px;
      margin: 0;
      padding: 0;
      overflow-y: auto;
      list-style: none;
    }

    #laps li {
      display: flex;
      justify-content: space-between;
      padding: 12px 4px;
      border-bottom: 1px solid #e5e7eb;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <h1 id="title">STOPWATCH</h1>
    <p id="timer" role="timer" aria-live="off">00:00:00</p>

    <div class="controls">
      <button id="start" type="button">START</button>
      <button id="pause" type="button" disabled>PAUSE</button>
      <button id="reset" type="button">RESET</button>
      <button id="lap" type="button" disabled>LAP</button>
    </div>

    <h2>Lap Times</h2>
    <ol id="laps" aria-label="Lap times"></ol>
  </main>

  <script>
    const timer = document.querySelector("#timer");
    const startButton = document.querySelector("#start");
    const pauseButton = document.querySelector("#pause");
    const resetButton = document.querySelector("#reset");
    const lapButton = document.querySelector("#lap");
    const laps = document.querySelector("#laps");

    let elapsedMs = 0;
    let startedAt = 0;
    let intervalId = null;

    function renderTimer() {
      const elapsed = elapsedMs + (intervalId === null ? 0 : performance.now() - startedAt);
      const totalSeconds = Math.floor(elapsed / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      timer.textContent = [hours, minutes, seconds]
        .map((value) => String(value).padStart(2, "0"))
        .join(":");
    }

    function startStopwatch() {
      if (intervalId !== null) return;

      startedAt = performance.now();
      intervalId = window.setInterval(renderTimer, 50);
      startButton.disabled = true;
      startButton.textContent = "RUNNING";
      pauseButton.disabled = false;
      lapButton.disabled = false;
    }

    function pauseStopwatch() {
      if (intervalId === null) return;

      elapsedMs += performance.now() - startedAt;
      window.clearInterval(intervalId);
      intervalId = null;
      renderTimer();
      startButton.disabled = false;
      startButton.textContent = "START";
      pauseButton.disabled = true;
      lapButton.disabled = true;
    }

    function resetStopwatch() {
      if (intervalId !== null) window.clearInterval(intervalId);
      intervalId = null;
      elapsedMs = 0;
      startedAt = 0;
      renderTimer();
      laps.replaceChildren();
      startButton.disabled = false;
      startButton.textContent = "START";
      pauseButton.disabled = true;
      lapButton.disabled = true;
    }

    function recordLap() {
      if (intervalId === null) return;

      const lap = document.createElement("li");
      const lapNumber = document.createElement("span");
      const lapTime = document.createElement("time");
      lapNumber.textContent = `Lap ${laps.children.length + 1}`;
      lapTime.textContent = timer.textContent;
      lap.append(lapNumber, lapTime);
      laps.prepend(lap);
    }

    startButton.addEventListener("click", startStopwatch);
    pauseButton.addEventListener("click", pauseStopwatch);
    resetButton.addEventListener("click", resetStopwatch);
    lapButton.addEventListener("click", recordLap);
  </script>
</body>
</html>
